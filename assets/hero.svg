<text x="84" y="360" style="font-family:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace;font-size:14px" fill="#8A8173">00:00:01,200 --> 00:00:06,400</text><text x="84" y="384" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">Olá, pessoal, bem-vindos à</text><text x="84" y="406" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">primeira aula do Horta em Casa.</text><text x="84" y="442" style="font-family:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace;font-size:14px" fill="#8A8173">00:00:06,750 --> 00:00:20,790</text><text x="84" y="466" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">Eu sou a Marina, e hoje a gente vai</text><text x="84" y="488" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">falar das duas coisas que mais decidem</text><text x="84" y="510" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">se a sua horta vai vingar ou morrer:</text><text x="84" y="532" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px" fill="#F2ECE1">luz e água.</text>
